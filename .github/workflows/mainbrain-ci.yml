---
# MAINBRAIN CI -- gates the vendored mainbrain/ tree.
#
# Scoped by `paths:` so it never runs for host-repo (vibe) changes, and the
# host's own ci.yml never runs for mainbrain changes. The vendored trees carry
# their own pytest.ini; the root pyproject restricts collection to vibe's
# tests/ and pre-commit excludes ^mainbrain/, so the two worlds do not fight.
name: mainbrain-ci

on:
  push:
    branches: [main]
    paths: ['mainbrain/**', '.github/workflows/mainbrain-ci.yml']
  pull_request:
    paths: ['mainbrain/**', '.github/workflows/mainbrain-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainbrain-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordlib:
    name: wordlib suite + proof gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: mainbrain/requirements-test.txt

      - name: Install test dependencies
        # Pinned in mainbrain/requirements-test.txt rather than listed inline:
        # unpinned installs silently re-resolved on every run, so someone
        # else's major release could turn this suite red with no change to our
        # code. A stable file also gives the pip cache a key to hit.
        run: |
          python -m pip install --upgrade pip
          pip install -r mainbrain/requirements-test.txt

      - name: Run wordlib suite
        working-directory: mainbrain/wordlib
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python tests/run_tests.py

      - name: Deploy proof gates
        working-directory: mainbrain/wordlib
        # deploy_check exits non-zero if any CNS proof gate fails.
        run: python deploy_check.py --json

      - name: Assert tests did not mutate source
        # The real invariant: a test run must never rewrite source. The
        # append-only docking ledgers ARE appended to by the suite (known
        # behaviour -- they are committed runtime state, tracked as a weakness),
        # so they are reported and restored rather than failing the build.
        run: |
          if ! git diff --quiet -- 'mainbrain/wordlib/docking/**/*.jsonl'; then
            echo "::notice::docking ledgers were appended to by the test run (known behaviour)"
            # ONLY the .jsonl ledgers -- source lives in this tree too
            git checkout -- 'mainbrain/wordlib/docking/**/*.jsonl'
          fi
          # Any other working-tree change is a real violation and fails here.
          git diff --exit-code

  ether-runtime:
    name: ether-runtime suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real Redis, so the RedisStoreAdapter's parity tests run against an
    # actual server and not only against the in-memory double. The double can
    # only ever prove the adapter agrees with itself; this proves it agrees with
    # Redis. SQLite remains the offline default -- nothing here makes Redis a
    # runtime dependency of the package.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: mainbrain/requirements-test.txt

      - name: Install pytest
        # redis-py is a test-only dependency here: it drives the live parity
        # parameter. Without it the live tests skip rather than fail. Pinned
        # alongside the rest in requirements-test.txt so both jobs resolve to
        # the same versions and share one cache key.
        run: |
          python -m pip install --upgrade pip
          pip install -r mainbrain/requirements-test.txt

      - name: Run ether-runtime suite
        working-directory: mainbrain/ether-runtime
        env:
          ETHER_TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -q

      - name: Assert the live Redis parity tests actually ran
        working-directory: mainbrain/ether-runtime
        # Guards against the silent-skip failure mode: if the service or the
        # env var ever goes missing, the suite would still pass green while
        # proving nothing about Redis. This fails instead.
        env:
          ETHER_TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/test_redis_store.py -q -k redis_live \
            --no-header -rN | tee /tmp/live.txt
          grep -qE '[0-9]+ passed' /tmp/live.txt
          if grep -qE '[0-9]+ skipped' /tmp/live.txt; then
            echo "::error::live Redis parity tests skipped -- server or env var missing"
            exit 1
          fi

      - name: CLI smoke test
        working-directory: mainbrain/ether-runtime
        # Proves the durable runtime works end-to-end from a cold start:
        # journal a task, drain it, confirm the journal reports it completed.
        run: |
          python -m ether_runtime --db "$RUNNER_TEMP/ci.db" \
            submit-absorb --source ci --text "mainbrain ci smoke"
          python -m ether_runtime --db "$RUNNER_TEMP/ci.db" work
          python -m ether_runtime --db "$RUNNER_TEMP/ci.db" status \
            | python -c "import json,sys; d=json.load(sys.stdin); \
                assert d['tasks_by_status'] == {'completed': 1}, d; \
                assert d['policy']['constraint_check'] == 'passed', d; \
                print('ether-runtime CLI smoke OK')"

  swarm:
    name: okcomputer-swarm typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The shell was never broken -- it had simply never been measured:
    # `tsc --noEmit` exits 0 with zero errors. A real blocking gate for type
    # regressions.
    #
    # W-11 RESOLVED: the transitive ajv-formats conflict (lock resolved 3.0.1
    # while a dependent required 2.1.1) is pinned via an `overrides` block in
    # package.json. `npm ci` now succeeds deterministically from the committed
    # lockfile, so CI builds the exact locked tree instead of re-resolving.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: mainbrain/okcomputer-swarm
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        working-directory: mainbrain/okcomputer-swarm
        run: npx tsc --noEmit -p tsconfig.json
